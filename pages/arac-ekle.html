</head>

<body>

    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <a title="Dursunoğlu Demir Çelik" href="../index.html">
            <img src="../assets/images/dursunoglu-demir-celik-logo.png" class="logo" alt="Dursunoğlu Demir Çelik Logo">
          </a>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center">
          <span><i class="fa-solid fa-envelope-open-text header-top-icon-1"></i> info@dursunogludemircelik.com</span>
          <span><i class="fa-solid fa-headphones header-top-icon-2"></i> 0232 625 10 42</span>
        </div>
      </div>
    </div>
    <div id="fdeco">
      <div class="container">
        <div class="row">
          <div class="col-md-9">
            <nav class="menu">
              <ul class="menu-list">
                <li class="menu-list-item"><a href="../index.html">Ana Sayfa</a></li>
                <li class="dropdown text-center menu-list-item">
                  <a href="#">Ayarlar</a>
                  <div class="menu-dropdown-item">
                    <ul class="menu-dropdown-bg">
                      <li><a href="kantar-ayarlari.html">Kantar Ayarları</a></li>
                      <li><a href="kullanici-ayarlari.html">Kullanıcı Ayarları</a></li>
                      <li><a href="sirket-bilgileri.html">Diğer Tanımlar</a></li>

            </nav>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Araç Ekle</h1>
    <form id="vehicle-form" class="form-container">
      <!-- Şoför Adı -->
      <div class="form-group">
        <label for="driver-first-name">Şoför Adı:</label>
        <input type="text" id="driver-first-name" name="driver-first-name" placeholder="Şoför Adı Gir" required>
      </div>

      <!-- Şoför Soyadı -->
      <div class="form-group">
        <label for="driver-last-name">Şoför Soyadı:</label>
        <input type="text" id="driver-last-name" name="driver-last-name" placeholder="Şoför Soyadı Gir" required>
      </div>

      <!-- TC Kimlik No -->
      <div class="form-group">
        <label for="tc-id">TC Kimlik No:</label>
        <input type="text" id="tc-id" name="tc-id" placeholder="TC Kimlik No Gir" required>
      </div>

      <!-- Araç Plakası -->
      <div class="form-group">
        <label for="vehicle-plate">Araç Plakası:</label>
        <input type="text" id="vehicle-plate" name="vehicle-plate" placeholder="Araç Plakası Gir" required>
      </div>

      <!-- Çekici Plakası -->
      <div class="form-group">
        <label for="tow-truck-plate">Çekici Plakası:</label>
        <input type="text" id="tow-truck-plate" name="tow-truck-plate" placeholder="Çekici Plakası Gir" required>
      </div>

      <!-- Çekici Plakası 2 -->
      <div class="form-group">
        <label for="tow-truck-plate-2">Çekici Plakası 2:</label>
        <input type="text" id="tow-truck-plate-2" name="tow-truck-plate-2" placeholder="Çekici Plakası 2 Gir">
      </div>

      <!-- Ruhsat Numarası -->
      <div class="form-group">
        <label for="registration-number">Ruhsat Numarası:</label>
        <input type="text" id="registration-number" name="registration-number" placeholder="Ruhsat Numarası Gir" required>
      </div>

      <!-- Firma Adı -->
      <div class="form-group">
        <label for="company-name">Firma Adı:</label>
        <input type="text" id="company-name" name="company-name" placeholder="Firma Adı Gir" required>
      </div>

      <!-- Açıklama -->
      <div class="form-group">
        <label for="description">Açıklama:</label>
        <textarea id="description" name="description" placeholder="Açıklama Gir" rows="4"></textarea>
      </div>

      <!-- Butonlar -->
      <div class="form-group button-group">
        <button type="button" id="delete-btn" class="btn btn-danger">Sil</button>
        <button type="button" id="edit-btn" class="btn btn-warning">Düzenle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>

    <!-- Kaydedilen Bilgiler Alanı -->
    <div class="saved-info">
      <h2>Kaydedilen Bilgiler</h2>
      <div id="saved-data"></div>
    </div>
  </div>

  <script src="../assets/js/libs/jquery.min.js"></script>
  <script src="../assets/js/libs/popper.min.js"></script>
  <script src="../assets/js/libs/bootstrap.min.js"></script>
  <script src="../assets/js/libs/fontawesome.min.js"></script>
  <script src="../assets/js/vehicle-form.js"></script>
</body>

</html>
