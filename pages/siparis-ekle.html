        <div class="col-md-6">
          <a title="Dursunoğlu Demir Çelik" href="../index.html">
            <img src="../assets/images/dursunoglu-demir-celik-logo.png" class="logo" alt="Dursunoğlu Demir Çelik Logo">
          </a>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center">
          <span><i class="fa-solid fa-envelope-open-text header-top-icon-1"></i> info@dursunogludemircelik.com</span>
          <span><i class="fa-solid fa-headphones header-top-icon-2"></i> 0232 625 10 42</span>
        </div>
      </div>
    </div>
    <div id="fdeco">
      <div class="container">
        <div class="row">
          <div class="col-md-9">
            <nav class="menu">
              <ul class="menu-list">
                <li class="menu-list-item"><a href="../index.html">Ana Sayfa</a></li>
                <li class="dropdown text-center menu-list-item">
                  <a href="#">Ayarlar</a>
                  <div class="menu-dropdown-item">
                    <ul class="menu-dropdown-bg">
                      <li><a href="kantar-ayarlari.html">Kantar Ayarları</a></li>

      </div>
    </div>
  </header>

  <div class="container">
    <h1>Sipariş Ekle</h1>
    <form id="order-form" class="form-container">
      <!-- Sipariş Numarası -->
      <div class="form-group">
        <label for="order-number">Sipariş Numarası:</label>
        <input type="text" id="order-number" name="order-number" placeholder="Sipariş Numarası Gir" required>
      </div>

      <!-- Cari Adı -->
      <div class="form-group">
        <label for="customer-name">Cari Adı:</label>
        <input type="text" id="customer-name" name="customer-name" placeholder="Cari Adı Gir" required>
      </div>

      <!-- Stok Adı -->
      <div class="form-group">
        <label for="stock-name">Stok Adı:</label>
        <input type="text" id="stock-name" name="stock-name" placeholder="Stok Adı Gir" required>
      </div>

      <!-- Miktar -->
      <div class="form-group">
        <label for="quantity">Miktar:</label>
        <input type="number" id="quantity" name="quantity" placeholder="Miktar Gir" required>
      </div>

      <!-- Fiyat -->
      <div class="form-group">
        <label for="price">Fiyat:</label>
        <input type="number" id="price" name="price" placeholder="Fiyat Gir" step="0.01" required>
      </div>

      <!-- KDV -->
      <div class="form-group">
        <label for="vat">KDV:</label>
        <select id="vat" name="vat" required>
          <option value="0">0%</option>
          <option value="10">10%</option>
          <option value="20">20%</option>
        </select>
      </div>

      <!-- Toplam Tutar -->
      <div class="form-group">
        <label for="total-amount">Toplam Tutar:</label>
        <input type="text" id="total-amount" name="total-amount" placeholder="Toplam Tutar" readonly>
      </div>

      <!-- Butonlar -->
      <div class="form-group button-group">
        <button type="button" id="delete-btn" class="btn btn-danger">Sil</button>
        <button type="button" id="edit-btn" class="btn btn-warning">Son Kaydı Düzenle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>

    <!-- Başarı mesajı -->
    <div id="success-msg" class="alert alert-success mt-3" style="display:none;"></div>

    <!-- Kaydedilen Bilgiler Alanı -->
    <div class="saved-info">
      <h2>Kayıtlı Siparişler</h2>
      <div id="saved-data"></div>
    </div>
  </div>

  <script src="../assets/js/libs/jquery.min.js"></script>

  <script src="../assets/js/libs/bootstrap.min.js"></script>

  <script src="../assets/js/order-form.js"></script>
