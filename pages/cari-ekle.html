</head>

        <div class="col-md-6">
          <a title="Dursunoğlu Demir Çelik" href="../index.html">
            <img src="../assets/images/dursunoglu-demir-celik-logo.png" class="logo" alt="Dursunoğlu Demir Çelik Logo">
          </a>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center">
          <span><i class="fa-solid fa-envelope-open-text header-top-icon-1"></i> info@dursunogludemircelik.com</span>
          <span><i class="fa-solid fa-headphones header-top-icon-2"></i> 0232 625 10 42</span>
        </div>
      </div>
    </div>
    <div id="fdeco">
      <div class="container">
        <div class="row">
          <div class="col-md-9">
            <nav class="menu">
              <ul class="menu-list">
                <li class="menu-list-item"><a href="../index.html">Ana Sayfa</a></li>
                <li class="dropdown text-center menu-list-item">
                  <a href="#">Ayarlar</a>
                  <div class="menu-dropdown-item">
                    <ul class="menu-dropdown-bg">
                      <li><a href="kantar-ayarlari.html">Kantar Ayarları</a></li>
                      <li><a href="kullanici-ayarlari.html">Kullanıcı Ayarları</a></li>

    </div>
  </header>

  <div class="container">
    <h1>Cari Ekle</h1>
    <form id="customer-form" class="form-container">
      <!-- Şirket Ünvanı -->
      <div class="form-group">
        <label for="company-name">Şirket Ünvanı:</label>
        <input type="text" id="company-name" name="company-name" placeholder="Şirket Ünvanı Gir" required>
      </div>

      <!-- Yetkili (Adı Soyadı) -->
      <div class="form-group">
        <label for="authorized-name">Yetkili (Adı Soyadı):</label>
        <input type="text" id="authorized-name" name="authorized-name" placeholder="Yetkili (Adı Soyadı) Gir" required>
      </div>

      <!-- TC Kimlik No -->
      <div class="form-group">
        <label for="id-number">TC Kimlik No:</label>
        <input type="text" id="id-number" name="id-number" placeholder="TC Kimlik No Gir" required>
      </div>

      <!-- Adres -->
      <div class="form-group">
        <label for="address">Adres:</label>
        <input type="text" id="address" name="address" placeholder="Adres Gir" required>
      </div>

      <!-- İl -->
      <div class="form-group">
        <label for="city">İl:</label>
        <input type="text" id="city" name="city" placeholder="İl Gir" required>
      </div>

      <!-- İlçe -->
      <div class="form-group">
        <label for="district">İlçe:</label>
        <input type="text" id="district" name="district" placeholder="İlçe Gir" required>
      </div>

      <!-- Vergi Dairesi -->
      <div class="form-group">
        <label for="tax-office">Vergi Dairesi:</label>
        <input type="text" id="tax-office" name="tax-office" placeholder="Vergi Dairesi Gir" required>
      </div>

      <!-- Vergi No -->
      <div class="form-group">
        <label for="tax-number">Vergi No:</label>
        <input type="text" id="tax-number" name="tax-number" placeholder="Vergi No Gir" required>
      </div>

      <!-- Telefon -->
      <div class="form-group">
        <label for="phone">Telefon:</label>
        <input type="text" id="phone" name="phone" placeholder="Telefon Gir" required>
      </div>

      <!-- Faks -->
      <div class="form-group">
        <label for="fax">Faks:</label>
        <input type="text" id="fax" name="fax" placeholder="Faks Gir">
      </div>

      <!-- Cep Telefonu -->
      <div class="form-group">
        <label for="mobile">Cep Telefonu:</label>
        <input type="text" id="mobile" name="mobile" placeholder="Cep Telefonu Gir" required>
      </div>

      <!-- E-posta -->
      <div class="form-group">
        <label for="email">E-posta:</label>
        <input type="email" id="email" name="email" placeholder="E-posta Gir" required>
      </div>

      <!-- Müşteri Türü -->
      <div class="form-group">
        <label>Müşteri Türü:</label>
        <div>
          <label><input type="radio" name="customer-type" value="Bireysel" checked> Bireysel</label>
          <label><input type="radio" name="customer-type" value="Kurumsal"> Kurumsal</label>
        </div>
      </div>

      <!-- Butonlar -->
      <div class="form-group button-group">
        <button type="button" id="delete-btn" class="btn btn-danger">Sil</button>
        <button type="button" id="edit-btn" class="btn btn-warning">Son Kaydı Düzenle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>

    <!-- Başarı mesajı -->
    <div id="success-msg" class="alert alert-success mt-3" style="display:none;"></div>

    <!-- Kaydedilen Bilgiler Alanı -->
    <div class="saved-info">
      <h2>Kayıtlı Cariler</h2>
      <div id="saved-data"></div>
    </div>
  </div>

  <script src="../assets/js/libs/jquery.min.js"></script>

  <script src="../assets/js/libs/bootstrap.min.js"></script>
  <script src="../assets/js/libs/fontawesome.min.js"></script>
  <script src="../assets/js/customer-form.js"></script>
</body>

</html>
