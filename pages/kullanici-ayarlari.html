  <div class="form-container">
    <h1>Kullanıcı Bilgileri</h1>
    <form id="user-settings-form" action="#" method="POST" class="user-form">
      <!-- Kayıt Adı -->
      <div class="form-group">
        <label for="record-name">Kayıt Adı:</label>
        <input type="text" id="record-name" name="record-name" placeholder="Kayıt Adı Gir" required>
      </div>

      <!-- Kullanıcı Adı -->
      <div class="form-group">
        <label for="username">Kullanıcı Adı:</label>
        <input type="text" id="username" name="username" placeholder="Kullanıcı Adı Gir" required>
      </div>

      <!-- Kullanıcı Soyadı -->
      <div class="form-group">
        <label for="lastname">Kullanıcı Soyadı:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Kullanıcı Soyadı Gir" required>
      </div>

      <!-- Şifre -->
      <div class="form-group">
        <label for="password">Şifre:</label>
        <input type="password" id="password" name="password" placeholder="Şifre Gir" required>
      </div>

      <!-- Kullanıcı Hakları -->
      <div class="form-group">
        <label>Kullanıcı Hakları:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="permissions" value="standard-user"> Standart Kullanıcı</label>
          <label><input type="checkbox" name="permissions" value="order-add"> Sipariş Ekler</label>
          <label><input type="checkbox" name="permissions" value="cari-add"> Cari Ekler</label>
          <label><input type="checkbox" name="permissions" value="stock-add"> Stok Ekler</label>
          <label><input type="checkbox" name="permissions" value="report-view"> Rapor Görür</label>
          <label><input type="checkbox" name="permissions" value="vehicle-add"> Araç Ekler</label>
          <label><input type="checkbox" name="permissions" value="system"> Sistem</label>
          <label><input type="checkbox" name="permissions" value="admin"> Admin</label>
        </div>
      </div>

      <!-- Açıklama -->
      <div class="form-group">
        <label for="description">Açıklama:</label>
        <textarea id="description" name="description" placeholder="Açıklama Gir" rows="4"></textarea>
      </div>

      <!-- Butonlar -->
      <div class="form-group">
        <button type="button" id="user-delete-btn" class="btn btn-danger">Sil</button>
        <button type="button" id="user-edit-btn" class="btn btn-warning">Düzenle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </div>

  <script src="../assets/js/libs/jquery.min.js"></script>
