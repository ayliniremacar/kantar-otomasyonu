  <div class="container kantar-settings-container">
    <h1>Kantar Ayarları</h1>
    <form id="kantar-settings-form" action="#" method="POST" class="kantar-form">
      <!-- Kantar Adı -->
      <div class="form-group">
        <label for="kantar-name">Kantar Adı:</label>
        <input type="text" id="kantar-name" name="kantar-name" placeholder="Kantar Adı Gir" required>
      </div>

      <!-- Seri No -->
      <div class="form-group">
        <label for="serial-no">Seri No:</label>
        <input type="text" id="serial-no" name="serial-no" placeholder="Seri No Gir" required>
      </div>

      <!-- Seri Port -->
      <div class="form-group">
        <label for="serial-port">Seri Port:</label>
        <select id="serial-port" name="serial-port" required>
          <option value="" disabled selected>Seri Port Seç</option>
          <option value="COM1">COM1</option>
          <option value="COM2">COM2</option>
          <option value="COM3">COM3</option>
          <option value="USB1">USB1</option>
          <option value="USB2">USB2</option>
          <option value="USB3">USB3</option>
        </select>
      </div>

      <!-- Data Bits -->
      <div class="form-group">
        <label for="data-bits">Data/Bits:</label>
        <select id="data-bits" name="data-bits" required>
          <option value="" disabled selected>Data Bits Seç</option>
          <option value="2 bit">2 bit</option>
          <option value="4 bit">4 bit</option>
          <option value="6 bit">6 bit</option>
          <option value="7 bit">7 bit</option>
          <option value="8 bit">8 bit</option>
        </select>
      </div>

      <!-- Baud Rate -->
      <div class="form-group">
        <label for="baud-rate">Baud Rate:</label>
        <select id="baud-rate" name="baud-rate" required>
          <option value="" disabled selected>Baud Rate Seç</option>
          <option value="600">600</option>
          <option value="1200">1200</option>
          <option value="2400">2400</option>
          <option value="4800">4800</option>
          <option value="9600">9600</option>
          <option value="14400">14400</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="56000">56000</option>
          <option value="57600">57600</option>
          <option value="115200">115200</option>
        </select>
      </div>

      <!-- Butonlar -->
      <div class="form-group button-group">
        <button type="reset" class="btn btn-danger">Temizle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </div>
