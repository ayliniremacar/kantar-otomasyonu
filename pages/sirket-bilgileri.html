  <div class="container">
    <h1>Şirket Bilgileri</h1>
    <form id="company-form" class="form-container">
      <!-- Ana Şirket Adı -->
      <div class="form-group">
        <label for="company-name">Ana Şirket Adı:</label>
        <input type="text" id="company-name" name="company-name" placeholder="Şirket Adı Gir" required>
      </div>

      <!-- Vergi Dairesi -->
      <div class="form-group">
        <label for="tax-office">Vergi Dairesi:</label>
        <input type="text" id="tax-office" name="tax-office" placeholder="Vergi Dairesi Gir" required>
      </div>

      <!-- Vergi No -->
      <div class="form-group">
        <label for="tax-number">Vergi No:</label>
        <input type="text" id="tax-number" name="tax-number" placeholder="Vergi No Gir" required>
      </div>

      <!-- Şirket Adresi -->
      <div class="form-group">
        <label for="company-address">Şirket Adresi:</label>
        <textarea id="company-address" name="company-address" placeholder="Şirket Adresi Gir" rows="3" required></textarea>
      </div>

      <!-- İl -->
      <div class="form-group">
        <label for="city">İl:</label>
        <input type="text" id="city" name="city" placeholder="İl Gir" required>
      </div>

      <!-- İlçe -->
      <div class="form-group">
        <label for="district">İlçe:</label>
        <input type="text" id="district" name="district" placeholder="İlçe Gir" required>
      </div>

      <!-- Telefon -->
      <div class="form-group">
        <label for="phone">Telefon:</label>
        <input type="text" id="phone" name="phone" placeholder="Telefon Gir" required>
      </div>

      <!-- Faks -->
      <div class="form-group">
        <label for="fax">Faks:</label>
        <input type="text" id="fax" name="fax" placeholder="Faks Gir">
      </div>

      <!-- Eposta -->
      <div class="form-group">
        <label for="email">Eposta:</label>
        <input type="email" id="email" name="email" placeholder="Eposta Gir" required>
      </div>

      <!-- Butonlar -->
      <div class="form-group button-group">
        <button type="button" id="company-delete-btn" class="btn btn-danger">Sil</button>
        <button type="button" id="company-edit-btn" class="btn btn-warning">Düzenle</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>

    <!-- Kaydedilen Bilgiler Alanı -->
    <div class="saved-info">
      <h2>Kaydedilen Şirket Bilgileri</h2>
      <div id="saved-data"></div>
    </div>
  </div>
